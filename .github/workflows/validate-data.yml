name: Validate Data

on:
  pull_request:
    paths:
      - 'data/**'
      - 'schema.json'
      - 'api-aggregators-schema.json'
      - 'scripts/validate*.js'
      - '.github/workflows/validate-data.yml'
      - 'package.json'
  push:
    branches:
      - master
    paths:
      - 'data/**'
      - 'schema.json'
      - 'api-aggregators-schema.json'
      - 'scripts/validate*.js'
      - '.github/workflows/validate-data.yml'
      - 'package.json'

jobs:
  validate-changed-files:
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'
      
      - name: 📥 Install dependencies
        run: npm ci
      
      # The file list goes to a file, not a step output: on bulk PRs (tens of
      # thousands of files) a single-line output exceeds argument limits, and
      # `xargs` used to split it across lines, which GitHub rejects as
      # "Invalid format".
      - name: 🔍 Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="HEAD~1 HEAD"
          fi
          git diff --name-only --diff-filter=ACMR $RANGE -- \
            'data/account-providers/*.json' \
            'data/api-aggregators/*.json' \
            'data/third-party-providers/*.json' > changed-files.txt

          COUNT=$(wc -l < changed-files.txt | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "📁 Changed data files: $COUNT"
          head -n 20 changed-files.txt

      - name: ℹ️ No files to validate
        if: steps.changed-files.outputs.count == '0'
        run: echo "No JSON files were changed"

      - name: 🔍 Validate changed files (schema and filename/ID)
        if: steps.changed-files.outputs.count != '0'
        run: node scripts/validate-changed.js --files-from changed-files.txt

      # Icon checks make an HTTP request per file, so bulk PRs only check a sample.
      - name: 🖼️ Validate icons for changed files
        if: steps.changed-files.outputs.count != '0'
        continue-on-error: true
        run: |
          head -n 200 changed-files.txt | xargs node scripts/validate-icons.js || echo "::warning::Some icon URLs are not accessible. Please ensure icons are uploaded."

      - name: ✅ Validation passed
        if: success()
        run: echo "✅ All validation checks passed for changed files!"

      # Persist the PR number so the separate (write-scoped) pr-comment workflow,
      # which runs via workflow_run, can post a comment even for fork PRs — where
      # github.event.workflow_run.pull_requests is empty.
      - name: 💾 Save PR number
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: ⬆️ Upload PR number artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr-number.txt
